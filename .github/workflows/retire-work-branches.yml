name: Archive and retire old work branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-work-branches.yml'
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve commits and delete redundant branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected; do
            [ -n "$branch" ] || continue
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$current" != "$expected" ]; then
              if [ -n "$current" ]; then echo "::error::Branch changed: $branch"; exit 1; fi
              continue
            fi
            tag="archive/branch-retirement-20261111/${branch//\//-}-${expected:0:12}"
            archived="$(gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$expected" --jq '.object.sha')"
            if [ "$archived" != "$expected" ]; then echo "::error::Archive mismatch: $branch"; exit 1; fi
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$current" != "$expected" ]; then echo "::error::Branch moved: $branch"; exit 1; fi
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            printf 'Archived and retired %s at %s\n' "$branch" "$expected"
          done <<'RETIRE_BRANCHES'
          hal/code-hardening-20261110|7f421f9567e97da59f9fb51bdf690644a5440440
          hal/qualify-release-version-20261110|bf558746efedd1421dcf790417d001144777c528
          hal/review-hardening-2026-11-10|bfb34b4e6f589ae78787f2007ec3f3128fd1cab2
          RETIRE_BRANCHES
